<html lang="pt-BR">

<meta name="apple-mobile-web-app-title" content="Selva">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --floresta:#1f3b2c; --musgo:#4f7a34; --folha:#e4efd6; --papel:#f3f6ee; --branco:#ffffff;
  --manga:#f2b01e; --hibisco:#c9306b; --tinta:#1b2a21; --suave:#5d6b61; --linha:#d9e2cf;
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --texto:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--texto);background:var(--papel);color:var(--tinta);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--manga);outline-offset:2px}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.topo{background:var(--floresta);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.topo h1{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.01em}
.topo .marca{display:flex;align-items:center;gap:12px}
.topo .marca img{width:40px;height:40px;border-radius:10px;display:block}
.entrada .logoimg{width:88px;height:88px;border-radius:22px;display:block;margin-bottom:14px}
.topo small{display:block;color:#bcd3a6;font-size:13px}
.topo .recarregar{color:#fff;font-size:20px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12)}
main{padding:16px;display:flex;flex-direction:column;gap:14px;flex:1}
.cartao{background:var(--branco);border:1px solid var(--linha);border-radius:14px;padding:14px}
.destaque{background:var(--floresta);color:#fff;border-radius:22px;padding:18px;border:0}
.destaque .num{font-family:var(--display);font-weight:800;font-size:56px;line-height:1;letter-spacing:-.03em}
.destaque .rotulo{color:#bcd3a6;font-size:14px}
.refs{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.ref{display:flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;background:rgba(255,255,255,.12);color:#cfe3bd}
.ref.ok{background:var(--manga);color:var(--tinta)}
.acoes{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
.btn{border-radius:999px;padding:14px 18px;font-weight:700;text-align:center;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.verde{background:var(--musgo);color:#fff}
.btn.hibisco{background:#fff;color:var(--hibisco);border:2px solid var(--hibisco)}
.btn.manga{background:var(--manga);color:var(--tinta)}
.btn.linha{background:#fff;border:1.5px solid var(--linha);color:var(--tinta)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.full{width:100%}
h2{font-family:var(--display);font-size:20px;font-weight:800;letter-spacing:-.01em}
h3{font-family:var(--display);font-size:17px;font-weight:600}
.sub{color:var(--suave);font-size:14px}
.carinho{background:#fff8e1;border:1px solid #f1dfae;border-radius:14px;padding:12px 14px;font-size:14px;color:#5b4a14;line-height:1.5}
.carinho b{display:block;margin-bottom:2px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.kpi{background:var(--papel);border-radius:12px;padding:12px;text-align:center}
.kpi .n{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.1}
.kpi .l{font-size:13px;color:var(--suave)}
.grafico{width:100%;height:auto;display:block}
.tip{font-size:14px;font-weight:700;min-height:20px;margin-top:6px}
.linhapeso{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--linha);font-size:15px}
.regras h3{margin-top:14px}
.regras ul{margin:6px 0 0 18px;font-size:15px}
.regras li{margin:4px 0}
.linhaform{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.aviso{background:var(--folha);border-radius:14px;padding:12px 14px;font-size:14px;color:#33502a}
.carbo{display:flex;gap:10px;align-items:flex-start;background:#fdf0c9;border-radius:12px;padding:10px 12px;font-size:14px;color:#6b4a00;font-weight:600}
.carbo input{width:20px;height:20px;margin-top:1px;flex:none;accent-color:var(--manga)}
.pendente{border:2px solid var(--hibisco);background:#fff5f8}
.pendente h3{color:var(--hibisco)}
.item{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--linha)}
.item:first-child{border-top:0;padding-top:0}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--folha);display:grid;place-items:center;font-size:22px;flex:none}
.item .corpo{flex:1;min-width:0}
.item .linha1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.item .nome{font-weight:700}
.pts{font-family:var(--display);font-weight:800;font-size:18px}
.pts.mais{color:var(--musgo)} .pts.menos{color:var(--hibisco)} .pts.zero{color:var(--suave)}
.quando{color:var(--suave);font-size:13px}
.tag{display:inline-block;border-radius:999px;font-size:12px;font-weight:700;padding:2px 9px;background:var(--folha);color:#33502a;margin-right:4px}
.tag.rosa{background:#fde4ed;color:var(--hibisco)}
.tag.manga{background:#fdf0c9;color:#7a5600}
.foto{width:100%;max-height:340px;object-fit:cover;border-radius:12px;margin-top:8px;background:var(--folha);display:block}
.mini{font-size:13px;font-weight:700;color:var(--hibisco);padding:6px 0}
.inter{display:flex;gap:8px;margin-top:10px}
.reagir{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;min-height:36px;border-radius:999px;border:1.5px solid var(--linha);background:#fff;font-weight:700;font-size:14px;color:var(--suave)}
.reagir.on{border-color:var(--hibisco);color:var(--hibisco);background:#fff5f8}
.coments{margin-top:10px;display:flex;flex-direction:column;gap:10px;background:var(--papel);border-radius:12px;padding:10px}
.coment{display:flex;gap:8px;font-size:15px;line-height:1.35}
.coment .av{width:28px;height:28px;border-radius:50%;background:var(--folha);display:grid;place-items:center;font-size:15px;flex:none}
.coment .quando{font-size:12px}
.coment .mini{padding:0 0 0 6px;font-size:12px}
.novo{display:flex;gap:8px}
.novo input{flex:1;min-width:0}
.novo .btn{padding:10px 16px}
.rank{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--linha)}
.rank:first-child{border-top:0}
.pos{width:34px;text-align:center;font-size:24px;font-family:var(--display);font-weight:800;color:var(--suave)}
.barra{height:8px;border-radius:99px;background:var(--folha);margin-top:6px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--musgo);border-radius:99px}
.seg{display:flex;background:var(--folha);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;padding:8px;border-radius:999px;font-weight:700;font-size:14px;color:#33502a}
.seg button.on{background:var(--floresta);color:#fff}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--linha);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav button{padding:10px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;font-weight:600;color:var(--suave)}
nav button span{font-size:20px;filter:grayscale(1);opacity:.7}
nav button.on{color:var(--floresta)} nav button.on span{filter:none;opacity:1}
label.campo{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:14px}
input[type=text],input[type=email],input[type=password],textarea,select{border:1.5px solid var(--linha);border-radius:12px;padding:12px;background:#fff;width:100%}
textarea{min-height:70px;resize:vertical}
.form{display:flex;flex-direction:column;gap:12px}
.entrada{min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:calc(24px + env(safe-area-inset-top,0px)) 24px 24px}
.entrada .logo{font-family:var(--display);font-weight:800;font-size:38px;line-height:1;letter-spacing:-.03em;color:var(--floresta)}
.emojis{display:flex;gap:6px;flex-wrap:wrap}
.emojis button{width:44px;height:44px;border-radius:50%;background:var(--folha);font-size:22px;border:2px solid transparent}
.emojis button.on{border-color:var(--floresta);background:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border-radius:999px;border:1.5px solid var(--linha);padding:6px 11px;font-size:13px;font-weight:600;background:#fff}
.chips button.on{background:var(--floresta);color:#fff;border-color:var(--floresta)}
#sheet{position:fixed;inset:0;z-index:20;display:none;background:rgba(20,35,27,.55);align-items:flex-end;justify-content:center}
#sheet.aberto{display:flex}
.folha{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:sobe .22s ease-out}
@keyframes sobe{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.folha .cab{display:flex;justify-content:space-between;align-items:center}
.folha .fechar{width:36px;height:36px;border-radius:50%;background:var(--folha);font-size:18px}
.camera{border:2px dashed var(--musgo);border-radius:16px;min-height:150px;display:grid;place-items:center;text-align:center;color:var(--musgo);font-weight:700;overflow:hidden;cursor:pointer;background:var(--papel)}
.camera img{width:100%;display:block;max-height:300px;object-fit:cover}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tinta);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.on{opacity:1}
details.receita{border-top:1px solid var(--linha);padding:10px 0}
details.receita:first-of-type{border-top:0}
details summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:8px}
details summary::-webkit-details-marker{display:none}
details ul{margin:8px 0 8px 20px;font-size:15px}
details p{font-size:15px;color:var(--suave)}
.hoje{background:var(--folha);border-radius:14px;padding:12px}
.vazio{text-align:center;color:var(--suave);padding:18px 8px}
.codigo{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.14em;color:var(--floresta)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ============ Estado ============ */
const S = {user:null, perfil:null, grupos:[], gid:null, tab:'inicio', feed:[], minhas:[], membros:{},
           rank:[], periodo:'semana', urls:{}, blob:null, modo:'entrar', emoji:'🌿', fase:'carregando',
           curtidas:{}, coments:{}, abertos:new Set(), rasc:{}, treinos:[], ativSel:'', pesos:[], refs:[], tipPeso:null, evoGrupo:[]};

/* ============ Utilidades ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('on'),2800); }
function inicioDoDia(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function inicioDaSemana(){ const d=inicioDoDia(); const dia=(d.getDay()+6)%7; d.setDate(d.getDate()-dia); return d; }
function quando(iso){
  const d=new Date(iso), h=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  if(d>=inicioDoDia()) return 'hoje, '+h;
  const ontem=inicioDoDia(); ontem.setDate(ontem.getDate()-1);
  if(d>=ontem) return 'ontem, '+h;
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+', '+h;
}
function erroAmigavel(e){
  const m=(e&&e.message)||String(e);
  if(/Invalid login/i.test(m)) return 'E-mail ou senha incorretos.';
  if(/already registered/i.test(m)) return 'Esse e-mail já tem cadastro. Use "Entrar".';
  if(/Password should be/i.test(m)) return 'A senha precisa ter pelo menos 6 caracteres.';
  if(/Email not confirmed/i.test(m)) return 'Confirme seu e-mail pelo link que enviamos e tente de novo.';
  return m;
}
const RE_CARBO = /\b(cuscuz|pao|paes|paozinho|tapioca|arroz|macarrao|espaguete|lasanha|nhoque|bolo|biscoito|bolacha|torrada|farofa|pizza|sanduiche|cereal|granola)\b/;
function acharCarbo(txt){
  const t = String(txt||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const m = t.match(RE_CARBO); return m ? m[1] : null;
}
function ptsClasse(p){ return p>0?'mais':p<0?'menos':'zero'; }
function ptsTexto(p){ return (p>0?'+':'')+p; }
const meu = () => S.perfil || {nome:'Você', emoji:'🌿'};

/* ============ Dados ============ */
async function init(){
  const {data:{session}} = await sb.auth.getSession();
  S.user = session ? session.user : null;
  sb.auth.onAuthStateChange(ev => { if(ev==='SIGNED_OUT'){ S.user=null; S.fase='pronto'; render(); } });
  if(S.user) await carregarTudo(); else { S.fase='pronto'; render(); }
  document.addEventListener('visibilitychange', () => { if(!document.hidden && S.user && S.gid) recarregar(true); });
}
async function carregarTudo(){
  S.fase='carregando'; render();
  const {data:p} = await sb.from('profiles').select('*').eq('id',S.user.id).maybeSingle();
  S.perfil = p;
  const {data:m} = await sb.from('membros').select('grupo_id, grupos(id,nome,codigo)').eq('user_id',S.user.id);
  S.grupos = (m||[]).map(x=>x.grupos).filter(Boolean);
  const salvo = localStorage.getItem('selva_gid');
  const achado = S.grupos.find(g=>g.id===salvo);
  S.gid = achado ? achado.id : (S.grupos[0] ? S.grupos[0].id : null);
  if(S.gid) await carregarGrupo();
  S.fase='pronto'; render();
  if(typeof registrarPush==='function') registrarPush(false);
}
async function carregarGrupo(){
  const desde = new Date(Date.now()-14*864e5).toISOString();
  const [r1,r2,r3,r4] = await Promise.all([
    sb.rpc('ranking_v2',{p_grupo:S.gid}),
    sb.from('registros').select('*').eq('grupo_id',S.gid).order('criado_em',{ascending:false}).limit(60),
    sb.from('registros').select('*').eq('grupo_id',S.gid).eq('user_id',S.user.id).gte('criado_em',desde).order('criado_em',{ascending:false}),
    sb.from('treinos').select('*').eq('grupo_id',S.gid).order('criado_em',{ascending:false}).limit(40)
  ]);
  S.membros = {}; (r1.data||[]).forEach(m=>S.membros[m.user_id]=m);
  S.feed = r2.data||[]; S.minhas = r3.data||[]; S.treinos = r4.data||[];
  await carregarFotos([...S.feed,...S.minhas,...S.treinos]);
  await carregarInteracoes();
  await carregarRanking();
  await carregarEvolucao();
}
async function carregarEvolucao(){
  const [a,b,c] = await Promise.all([
    sb.from('pesos').select('*').eq('user_id',S.user.id).order('data',{ascending:true}),
    sb.from('registros').select('carbo,criado_em').eq('grupo_id',S.gid).eq('user_id',S.user.id).eq('tipo','refeicao'),
    sb.rpc('evolucao_grupo',{p_grupo:S.gid})
  ]);
  S.pesos = a.data||[]; S.refs = b.data||[]; S.evoGrupo = c.data||[];
}
async function carregarInteracoes(){
  S.curtidas = {}; S.coments = {};
  const ids = S.feed.map(r=>r.id), tids = S.treinos.map(t=>t.id);
  const [c1,c2,c3,c4] = await Promise.all([
    ids.length ? sb.from('curtidas').select('registro_id,user_id').in('registro_id',ids) : {data:[]},
    ids.length ? sb.from('comentarios').select('*').in('registro_id',ids).order('criado_em',{ascending:true}) : {data:[]},
    tids.length ? sb.from('treino_curtidas').select('treino_id,user_id').in('treino_id',tids) : {data:[]},
    tids.length ? sb.from('treino_comentarios').select('*').in('treino_id',tids).order('criado_em',{ascending:true}) : {data:[]}
  ]);
  [...(c1.data||[]),...(c3.data||[])].forEach(x=>{ const k=x.registro_id||x.treino_id; (S.curtidas[k]=S.curtidas[k]||new Set()).add(x.user_id); });
  [...(c2.data||[]),...(c4.data||[])].forEach(x=>{ const k=x.registro_id||x.treino_id; (S.coments[k]=S.coments[k]||[]).push(x); });
}
async function carregarFotos(lista){
  const paths = [...new Set(lista.map(r=>r.foto_path).filter(p=>p && !S.urls[p]))];
  if(!paths.length) return;
  const {data} = await sb.storage.from('fotos').createSignedUrls(paths, 3600);
  (data||[]).forEach(x=>{ if(x.signedUrl) S.urls[x.path]=x.signedUrl; });
}
async function carregarRanking(){
  let desde = null;
  if(S.periodo==='hoje') desde = inicioDoDia().toISOString();
  if(S.periodo==='semana') desde = inicioDaSemana().toISOString();
  const {data} = await sb.rpc('ranking_v2',{p_grupo:S.gid, p_desde:desde});
  S.rank = data||[];
}
async function recarregar(silencioso){
  if(!S.gid) return;
  await carregarGrupo(); render();
  if(!silencioso) toast('Atualizado ✓');
}

/* ============ Telas ============ */
function render(){
  const app = $('#app');
  if(S.fase==='carregando'){ app.innerHTML = '<div class="entrada"><div class="logo">Desafio da Selva 🌿</div><p class="sub">Carregando…</p></div>'; return; }
  if(!S.user){ app.innerHTML = telaEntrada(); return; }
  if(!S.gid){ app.innerHTML = telaGrupo(); return; }
  const g = S.grupos.find(x=>x.id===S.gid);
  const corpo = S.tab==='inicio' ? vInicio() : S.tab==='ranking' ? vRanking() : S.tab==='treino' ? vTreino() : S.tab==='evolucao' ? vEvolucao() : S.tab==='receitas' ? vReceitas() : vPerfil();
  app.innerHTML = `
    <header class="topo"><div class="marca"><img src="icon-192.png" alt=""><div><h1>Desafio da Selva</h1><small>${esc(g?g.nome:'')}</small></div></div>
      <button class="recarregar" data-act="recarregar" aria-label="Atualizar">⟳</button></header>
    <main>${corpo}</main>
    <nav><div>
      ${[['inicio','🏠','Início'],['ranking','🏆','Ranking'],['treino','💪','Treino'],['evolucao','📈','Evolução'],['receitas','🥗','Receitas'],['perfil','👤','Perfil']]
        .map(([k,e,l])=>`<button data-act="tab" data-v="${k}" class="${S.tab===k?'on':''}"><span>${e}</span>${l}</button>`).join('')}
    </div></nav>`;
}

  return `<header class="topo"><div class="marca"><img src="icon-192.png" alt=""><div><h1>Desafio da Selva</h1><small>Olá, ${esc(meu().nome)} ${esc(meu().emoji)}</small></div></div></header>
  <main>

function hoje(){ const i=inicioDoDia(); return S.minhas.filter(r=>new Date(r.criado_em)>=i); }
function pagas(){ return new Set([...S.feed,...S.minhas].filter(r=>r.tipo==='desafio').map(r=>r.escorregada_id)); }

function vInicio(){
  const h = hoje();
  const pts = h.reduce((a,r)=>a+r.pontos,0) + treinosHoje().reduce((a,t)=>a+t.pontos,0);
  const feitas = new Set(h.filter(r=>r.tipo==='refeicao').map(r=>r.refeicao));
  const pg = pagas();
  const pendentes = S.minhas.filter(r=>r.tipo==='escorregada' && !pg.has(r.id));
  return `
  ${bannerPush()}
  <section class="destaque">
    <div class="rotulo">Seus pontos hoje</div>
    <div class="num">${pts}</div>
    <div class="refs">${Object.entries(REFEICOES).map(([k,v])=>`<span class="ref ${feitas.has(k)?'ok':''}">${v.emoji} ${v.nome}${feitas.has(k)?' ✓':''}</span>`).join('')}</div>
  </section>
  <div class="acoes">
    <button class="btn verde" data-act="abrir-refeicao">📷 Registrar refeição</button>
    <button class="btn hibisco" data-act="abrir-escorregada">🍫 Escorreguei</button>
  </div>
  ${cartaoCarinho()}
  ${pendentes.length?`<section class="cartao pendente"><h3>Escorregadas para pagar</h3>
    <p class="sub" style="margin-bottom:6px">Pague com um desafio e recupere os pontos.</p>
    ${pendentes.map(r=>`<div class="item"><div class="corpo"><div class="nome">${esc(r.descricao||'Escorregada')}</div><div class="quando">${quando(r.criado_em)}</div></div>
      <button class="btn manga" style="padding:9px 14px" data-act="abrir-pagar" data-id="${r.id}">Pagar</button></div>`).join('')}</section>`:''}
  <section class="cartao"><h2 style="margin-bottom:10px">Movimento do grupo</h2>
    ${S.feed.length ? S.feed.map(itemFeed).join('') : '<div class="vazio">Ninguém registrou nada ainda. Seja o primeiro! 🌱</div>'}
  </section>`;
}

function itemFeed(r){
  const m = S.membros[r.user_id] || {nome:'Alguém', emoji:'🌿'};
  const eu = r.user_id===S.user.id;
  const pg = pagas();
  let tag='', texto='';
  if(r.tipo==='refeicao'){ const f=REFEICOES[r.refeicao]||{nome:'Refeição',emoji:'🍽️'}; tag=`<span class="tag">${f.emoji} ${f.nome}</span>${r.carbo?'<span class="tag manga">🍞 com carbo</span>':''}`; texto=r.descricao||''; }
  if(r.tipo==='escorregada'){ tag=`<span class="tag rosa">🍫 Escorregada</span>${pg.has(r.id)?'<span class="tag">pago ✓</span>':''}`; texto=r.descricao||''; }
  if(r.tipo==='desafio'){ tag='<span class="tag manga">💪 Desafio pago</span>'; texto=r.desafio||''; }
  const apagavel = eu && (Date.now()-new Date(r.criado_em).getTime() < 10*60*1000);
  return `<div class="item" data-id="${r.id}">
    <div class="avatar">${esc(m.emoji)}</div>
    <div class="corpo">
      <div class="linha1"><span class="nome">${esc(eu?'Você':m.nome)}</span><span class="pts ${ptsClasse(r.pontos)}">${ptsTexto(r.pontos)}</span></div>
      <div class="quando">${quando(r.criado_em)}</div>
      <div style="margin-top:4px">${tag}</div>
      ${texto?`<div style="margin-top:4px">${esc(texto)}</div>`:''}
      ${r.foto_path && S.urls[r.foto_path]?`<img class="foto" loading="lazy" alt="Foto registrada" src="${esc(S.urls[r.foto_path])}">`:''}
      ${interacao(r)}
      ${apagavel?`<button class="mini" data-act="apagar" data-id="${r.id}">Desfazer registro</button>`:''}
    </div></div>`;
}

function interacao(r){
  const cur = S.curtidas[r.id] || new Set();
  const lista = S.coments[r.id] || [];
  const curti = cur.has(S.user.id);
  const aberto = S.abertos.has(r.id);
  const blocoComent = c => {
    const m = S.membros[c.user_id] || {nome:'Alguém', emoji:'🌿'};
    const meu = c.user_id===S.user.id;
    return `<div class="coment"><span class="av">${esc(m.emoji)}</span><div>
      <b>${esc(meu?'Você':m.nome)}</b> <span class="quando">${quando(c.criado_em)}</span>${meu?`<button class="mini" data-act="apagar-coment" data-id="${c.id}" data-reg="${r.id}">apagar</button>`:''}
      <div>${esc(c.texto)}</div></div></div>`;
  };
  return `<div class="inter">
    <button class="reagir ${curti?'on':''}" data-act="curtir" data-id="${r.id}" aria-pressed="${curti}" aria-label="Curtir">${curti?'❤️':'🤍'} <span>${cur.size||''}</span></button>
    <button class="reagir ${aberto?'on':''}" data-act="abrir-coment" data-id="${r.id}" aria-expanded="${aberto}">💬 <span>${lista.length||'Comentar'}</span></button>
  </div>
  ${aberto?`<div class="coments">
    ${lista.map(blocoComent).join('')}
    <div class="novo"><input type="text" maxlength="300" placeholder="Comentar…" data-rasc="${r.id}" value="${esc(S.rasc[r.id]||'')}" autocomplete="off">
      <button class="btn verde" data-act="enviar-coment" data-id="${r.id}">Enviar</button></div>
  </div>`:''}`;
}
function campoComent(id){ return document.querySelector(`input[data-rasc="${id}"]`); }
const ehTreino = id => S.treinos.some(x=>x.id===id);
const tabInter = id => ehTreino(id) ? {cur:'treino_curtidas', com:'treino_comentarios', col:'treino_id'} : {cur:'curtidas', com:'comentarios', col:'registro_id'};
function atualizarItem(id){
  const ehT = ehTreino(id);
  const r = ehT ? S.treinos.find(x=>x.id===id) : S.feed.find(x=>x.id===id), el = document.querySelector(`.item[data-id="${id}"]`);
  if(!r || !el){ render(); return; }
  const tmp = document.createElement('div'); tmp.innerHTML = (ehT ? itemTreino(r) : itemFeed(r)).trim();
  el.replaceWith(tmp.firstElementChild);
}

function meusTreinos(){ return S.treinos.filter(t=>t.user_id===S.user.id); }
function treinosHoje(){ const i=inicioDoDia(); return meusTreinos().filter(t=>new Date(t.criado_em)>=i); }
function itemTreino(t){
  const m = S.membros[t.user_id] || {nome:'Alguém', emoji:'🌿'};
  const eu = t.user_id===S.user.id;
  const a = ATIVIDADES[t.atividade] || {nome:'Treino', emoji:'💪'};
  const apagavel = eu && (Date.now()-new Date(t.criado_em).getTime() < 10*60*1000);
  return `<div class="item" data-id="${t.id}">
    <div class="avatar">${esc(m.emoji)}</div>
    <div class="corpo">
      <div class="linha1"><span class="nome">${esc(eu?'Você':m.nome)}</span><span class="pts mais">+${t.pontos}</span></div>
      <div class="quando">${quando(t.criado_em)}</div>
      <div style="margin-top:4px"><span class="tag manga">${a.emoji} ${a.nome}</span></div>
      ${t.descricao?`<div style="margin-top:4px">${esc(t.descricao)}</div>`:''}
      ${t.foto_path && S.urls[t.foto_path]?`<img class="foto" loading="lazy" alt="Foto do treino" src="${esc(S.urls[t.foto_path])}">`:''}
      ${interacao(t)}
      ${apagavel?`<button class="mini" data-act="apagar-treino" data-id="${t.id}">Desfazer treino</button>`:''}
    </div></div>`;
}
function vTreino(){
  const feitoHoje = treinosHoje().length>0;
  const semana = meusTreinos().filter(t=>new Date(t.criado_em)>=inicioDaSemana()).length;
  return `
  <section class="destaque">
    <div class="rotulo">Seus treinos esta semana</div>
    <div class="num">${semana}</div>

const fmtKg = n => Number(n).toFixed(1).replace('.',',');
const fmtVar = n => (n>0.049?'+':n<-0.049?'−':'') + fmtKg(Math.abs(n));
const fmtData = d => { const [,m,dd]=d.split('-'); return dd+'/'+m; };
function hojeISO(){ const d=new Date(), z=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); }
function graficoLinha(p, fmt, interativo){
  const W=320,H=130,pl=38,pr=12,pt=14,pb=24;
  const ts = p.map(x=>new Date(x.data+'T12:00:00').getTime()), vs = p.map(x=>Number(x.v));
  const t0=Math.min(...ts), t1=Math.max(...ts);
  let lo=Math.min(...vs), hi=Math.max(...vs);
  if(hi-lo<1){ lo-=0.5; hi+=0.5; } else { const m=(hi-lo)*0.15; lo-=m; hi+=m; }
  const X = t => t1===t0 ? pl+(W-pl-pr)/2 : pl+(t-t0)/(t1-t0)*(W-pl-pr);
  const Y = v => pt+(hi-v)/(hi-lo)*(H-pt-pb);
  const pts = p.map((x,i)=>[X(ts[i]),Y(vs[i])]);
  const grade = [hi,(hi+lo)/2,lo].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--linha)" stroke-width="1"/><text x="${pl-4}" y="${Y(v)+3.5}" text-anchor="end" font-size="10" style="fill:var(--suave)">${fmt(v)}</text>`).join('');
  const marcas = pts.map((a,i)=>`<g ${interativo?`data-act="tip-peso" data-i="${i}" style="cursor:pointer"`:''}><circle cx="${a[0]}" cy="${a[1]}" r="16" fill="transparent"/><circle cx="${a[0]}" cy="${a[1]}" r="4.5" style="fill:var(--musgo);stroke:#fff" stroke-width="2"/></g>`).join('');
  return `<svg class="grafico" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico da evolução do peso">${grade}
    ${pts.length>1?`<polyline points="${pts.map(a=>a.join(',')).join(' ')}" fill="none" style="stroke:var(--musgo)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`:''}
    ${marcas}
    <text x="${pl}" y="${H-6}" font-size="10" style="fill:var(--suave)">${fmtData(p[0].data)}</text>
    ${p.length>1?`<text x="${W-pr}" y="${H-6}" text-anchor="end" font-size="10" style="fill:var(--suave)">${fmtData(p[p.length-1].data)}</text>`:''}</svg>`;
}

/* ============ Foto ============ */
function prepararFoto(file){
  return new Promise((ok,falha)=>{
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const max=1280, s=Math.min(1,max/Math.max(img.width,img.height));
      const w=Math.round(img.width*s), h=Math.round(img.height*s);
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      const x=c.getContext('2d'); x.drawImage(img,0,0,w,h);
      const txt=new Date().toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
      const fs=Math.max(14,Math.round(w*0.036)), pad=Math.round(fs*0.5);
      x.font=`600 ${fs}px sans-serif`; x.textBaseline='middle';
      const tw=x.measureText(txt).width;
      x.fillStyle='rgba(0,0,0,.6)'; x.fillRect(0,h-fs-pad*2,tw+pad*2,fs+pad*2);
      x.fillStyle='#fff'; x.fillText(txt,pad,h-pad-fs/2);
      URL.revokeObjectURL(url);
      c.toBlob(b=> b?ok(b):falha(new Error('Não foi possível processar a foto.')),'image/jpeg',0.82);
    };
    img.onerror = () => falha(new Error('Não foi possível abrir a foto.'));
    img.src = url;
  });
}

  return path;

  const precisaTexto = b.dataset.act==='salvar-desafio';
  const texto = precisaTexto ? ($('#f_desafio').value.trim() || S.desafioSel) : (b.dataset.act==='salvar-treino' ? !!S.ativSel : true);
  b.disabled = !(S.blob && texto);
}

/* ============ Ações ============ */
async function comCarga(btn, rotulo, fn){
  const antes = btn ? btn.textContent : '';
  if(btn){ btn.disabled=true; btn.textContent=rotulo; }
  try{ await fn(); }
  catch(e){ toast(erroAmigavel(e)); if(btn){ btn.disabled=false; btn.textContent=antes; } }
}

const ACOES = {
  tab: el => { S.tab=el.dataset.v; render(); window.scrollTo(0,0); },
  modo: el => { S.modo=el.dataset.v; render(); },
  emoji: el => { S.emoji=el.dataset.v; document.querySelectorAll('.emojis button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.emoji)); },
  fechar: () => fecharFolha(),
  recarregar: () => recarregar(false),
  periodo: async el => { S.periodo=el.dataset.v; await carregarRanking(); render(); },
  ref: el => { S.refSel=el.dataset.v; document.querySelectorAll('#chipsRef button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.refSel)); },
  chip: el => { S.desafioSel=el.dataset.v; $('#f_desafio').value=''; document.querySelectorAll('.chips button').forEach(b=>b.classList.toggle('on',b===el)); atualizarBotao(); },
  'abrir-refeicao': () => folhaRefeicao(),
  'abrir-escorregada': () => folhaEscorregada(),
  'abrir-treino': () => folhaTreino(),
  'tip-peso': el => { const i=Number(el.dataset.i), x=S.pesos[i]; S.tipPeso=i; const t=$('#tipPeso'); if(t&&x) t.textContent = fmtData(x.data)+' · '+fmtKg(x.peso)+' kg'; },
  'salvar-peso': el => comCarga(el,'Salvando…', async () => {
    const data = $('#f_pdata').value, v = parseFloat(String($('#f_peso').value).replace(',','.'));
    if(!data) throw new Error('Escolha a data.');
    if(!(v>=20 && v<=400)) throw new Error('Digite um peso válido, em kg.');
    const {error} = await sb.from('pesos').upsert({user_id:S.user.id, data, peso:v}, {onConflict:'user_id,data'});
    if(error) throw error;
    await carregarEvolucao(); S.tipPeso=null; render(); toast('Peso salvo ✓');
  }),
  'alternar-evolucao': async el => {
    const novo = !(S.perfil && S.perfil.mostrar_evolucao);
    el.disabled = true;
    const {error} = await sb.from('profiles').update({mostrar_evolucao:novo}).eq('id',S.user.id);
    if(error){ el.disabled = false; toast(erroAmigavel(error)); return; }
    S.perfil = Object.assign({}, S.perfil, {mostrar_evolucao:novo});
    render(); toast(novo ? 'Agora o grupo vê a sua evolução' : 'Você deixou de compartilhar');
  },
  'apagar-peso': async el => {
    if(!confirm('Apagar esse registro de peso?')) return;
    const {error} = await sb.from('pesos').delete().eq('id',el.dataset.id);
    if(error){ toast(erroAmigavel(error)); return; }
    await carregarEvolucao(); S.tipPeso=null; render(); toast('Registro apagado');
  },
  ativ: el => { S.ativSel=el.dataset.v; document.querySelectorAll('#chipsAtiv button').forEach(b=>b.classList.toggle('on',b===el)); atualizarBotao(); },
  'salvar-treino': el => comCarga(el,'Enviando…', async () => {
    const foto = await enviarFoto();
    const {error} = await sb.from('treinos').insert({grupo_id:S.gid,user_id:S.user.id,atividade:S.ativSel,descricao:$('#f_desc').value.trim()||null,foto_path:foto});
    if(error) throw error;
    fecharFolha(); await carregarGrupo(); render(); toast('Treino registrado! +10 pontos 💪');
  }),
  'apagar-treino': async el => {
    if(!confirm('Desfazer esse treino?')) return;
    const {error} = await sb.from('treinos').delete().eq('id',el.dataset.id);
    if(error){ toast(erroAmigavel(error)); return; }
    await carregarGrupo(); render(); toast('Treino desfeito');
  },
  'abrir-pagar': el => folhaPagar(el.dataset.id),
  grupo: async el => { S.gid=el.dataset.id; localStorage.setItem('selva_gid',S.gid); S.fase='carregando'; render(); await carregarGrupo(); S.fase='pronto'; S.tab='inicio'; render(); },

  entrar: el => comCarga(el,'Entrando…', async () => {
    const {error} = await sb.auth.signInWithPassword({email:$('#f_email').value.trim(), password:$('#f_senha').value});
    if(error) throw error;
    const {data:{user}} = await sb.auth.getUser(); S.user=user; await carregarTudo();
  }),
  cadastrar: el => comCarga(el,'Criando…', async () => {
    const nome=$('#f_nome').value.trim();
    if(!nome) throw new Error('Digite seu nome.');
    const {data,error} = await sb.auth.signUp({email:$('#f_email').value.trim(), password:$('#f_senha').value, options:{data:{nome, emoji:S.emoji}}});
    if(error) throw error;
    if(!data.session){ S.modo='entrar'; render(); toast('Conta criada! Confirme o e-mail e depois entre.'); return; }
    S.user=data.user; await carregarTudo();
  }),
  'ativar-push': () => registrarPush(true),
  sair: async () => { await sb.auth.signOut(); S.user=null; S.perfil=null; S.grupos=[]; S.gid=null; S.fase='pronto'; S.modo='entrar'; render(); },

  'criar-grupo': el => comCarga(el,'Criando…', async () => {
    const nome=$('#f_gnome').value.trim(); if(!nome) throw new Error('Digite o nome do grupo.');
    const {data,error} = await sb.rpc('criar_grupo',{p_nome:nome}); if(error) throw error;
    localStorage.setItem('selva_gid',data.id); await carregarTudo(); S.tab='perfil'; render(); toast('Grupo criado! Passe o código para os amigos.');
  }),
  'entrar-grupo': el => comCarga(el,'Entrando…', async () => {
    const c=$('#f_codigo').value.trim(); if(!c) throw new Error('Digite o código do grupo.');
    const {data,error} = await sb.rpc('entrar_grupo',{p_codigo:c}); if(error) throw error;
    localStorage.setItem('selva_gid',data); await carregarTudo(); S.tab='inicio'; render(); toast('Você entrou no grupo! 🌿');
  }),
  'copiar-codigo': async () => {
    const g=S.grupos.find(x=>x.id===S.gid); if(!g) return;
    const msg=`Entra no Desafio da Selva comigo! Grupo "${g.nome}", código: ${g.codigo}\n${location.href.split('#')[0]}`;
    try{ if(navigator.share){ await navigator.share({text:msg}); } else { await navigator.clipboard.writeText(msg); toast('Convite copiado!'); } }
    catch(e){ try{ await navigator.clipboard.writeText(msg); toast('Convite copiado!'); }catch(_){ toast('Código: '+g.codigo); } }
  },

  'salvar-refeicao': el => comCarga(el,'Enviando…', async () => {
    const foto = await enviarFoto();
    const {error} = await sb.from('registros').insert({grupo_id:S.gid,user_id:S.user.id,tipo:'refeicao',refeicao:S.refSel,descricao:$('#f_desc').value.trim()||null,foto_path:foto,carbo:$('#f_carbo').checked});
    if(error) throw error;
    const comCarbo = $('#f_carbo').checked;
    fecharFolha(); await carregarGrupo(); render(); toast(comCarbo ? 'Refeição registrada! +5 pontos 🍞' : 'Refeição registrada! +10 pontos 🌿');
  }),
  'salvar-escorregada': el => comCarga(el,'Salvando…', async () => {
    const {error} = await sb.from('registros').insert({grupo_id:S.gid,user_id:S.user.id,tipo:'escorregada',descricao:$('#f_desc').value.trim()||null});
    if(error) throw error;
    fecharFolha(); await carregarGrupo(); render(); toast('Anotado. Agora é só pagar o desafio 💪');
  }),
  'salvar-desafio': el => comCarga(el,'Enviando…', async () => {
    const desafio = $('#f_desafio').value.trim() || S.desafioSel;
    const foto = await enviarFoto();
    const {error} = await sb.from('registros').insert({grupo_id:S.gid,user_id:S.user.id,tipo:'desafio',escorregada_id:S.pagarId,desafio,foto_path:foto});
    if(error) throw error;
    fecharFolha(); await carregarGrupo(); render(); toast('Desafio pago! +10 pontos 💪');
  }),
  curtir: async el => {
    const id = el.dataset.id; if(!S.feed.find(x=>x.id===id) && !ehTreino(id)) return;
    const T = tabInter(id);
    const set = S.curtidas[id] || (S.curtidas[id] = new Set());
    const tinha = set.has(S.user.id);
    tinha ? set.delete(S.user.id) : set.add(S.user.id);
    atualizarItem(id);
    const {error} = tinha
      ? await sb.from(T.cur).delete().eq(T.col,id).eq('user_id',S.user.id)
      : await sb.from(T.cur).insert({[T.col]:id, user_id:S.user.id, grupo_id:S.gid});
    if(error && !/duplicate/i.test(error.message)){
      tinha ? set.add(S.user.id) : set.delete(S.user.id);
      atualizarItem(id); toast(erroAmigavel(error));
    }
  },
  'abrir-coment': el => {
    const id = el.dataset.id;
    S.abertos.has(id) ? S.abertos.delete(id) : S.abertos.add(id);
    atualizarItem(id);
    if(S.abertos.has(id)){ const i = campoComent(id); if(i) i.focus(); }
  },
  'enviar-coment': async el => {
    const id = el.dataset.id, inp = campoComent(id);
    const texto = (inp ? inp.value : '').trim(); if(!texto) return;
    el.disabled = true;
    const T = tabInter(id);
    const {data,error} = await sb.from(T.com).insert({[T.col]:id, grupo_id:S.gid, user_id:S.user.id, texto}).select().single();
    if(error){ el.disabled = false; toast(erroAmigavel(error)); return; }
    (S.coments[id] = S.coments[id] || []).push(data);
    S.rasc[id] = '';
    atualizarItem(id);
    const i = campoComent(id); if(i) i.focus();
  },
  'apagar-coment': async el => {
    if(!confirm('Apagar seu comentário?')) return;
    const rid = el.dataset.reg;
    const {error} = await sb.from(tabInter(rid).com).delete().eq('id',el.dataset.id);
    if(error){ toast(erroAmigavel(error)); return; }
    S.coments[rid] = (S.coments[rid]||[]).filter(c=>c.id!==el.dataset.id);
    atualizarItem(rid);
  },
  apagar: async el => {
    if(!confirm('Desfazer esse registro?')) return;
    const {error} = await sb.from('registros').delete().eq('id',el.dataset.id);
    if(error){ toast(erroAmigavel(error)); return; }
    await carregarGrupo(); render(); toast('Registro desfeito');
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(el){ const fn = ACOES[el.dataset.act]; if(fn){ e.preventDefault(); fn(el); } return; }
  if(e.target.id==='sheet') fecharFolha();
});
document.addEventListener('change', async e => {
  if(e.target.id!=='fotoIn') return;
  const f = e.target.files[0]; if(!f) return;
  try{
    S.blob = await prepararFoto(f);
    const box = $('#fotoBox');
    box.innerHTML = `<input type="file" accept="image/*" capture="environment" id="fotoIn" hidden><img alt="Prévia da foto" src="${URL.createObjectURL(S.blob)}">`;
    atualizarBotao();
  }catch(err){ toast(erroAmigavel(err)); }
});
document.addEventListener('input', e => { if(e.target.dataset && e.target.dataset.rasc){ S.rasc[e.target.dataset.rasc] = e.target.value; return; }
  if(e.target.id==='f_desc'){
    const cb = $('#f_carbo'), tx = $('#txtCarbo'); if(!cb) return;
    const achou = acharCarbo(e.target.value);
    if(achou){ cb.checked = true; cb.disabled = true; tx.textContent = '🍞 Detectei "' + achou + '" na descrição: essa refeição vale 5 pontos.'; }
    else { cb.disabled = false; tx.textContent = '🍞 Tem carboidrato fora da dieta (cuscuz, pão, arroz…)? Marque aqui: a refeição vale 5 pontos em vez de 10.'; }
    return;
  }
  if(e.target.id==='f_desafio'){ S.desafioSel=''; document.querySelectorAll('.chips button').forEach(b=>b.classList.remove('on')); atualizarBotao(); } });

document.addEventListener('keydown', e => {
  if(e.key==='Enter' && e.target.dataset && e.target.dataset.rasc){
    e.preventDefault();
    const b = e.target.closest('.novo').querySelector('[data-act="enviar-coment"]'); if(b) b.click();
  }
});

/* ============ Notificações (lembretes automáticos) ============ */
const VAPID_PUBLIC = 'BKmIqi2leWunc67TviMMfVj7g9GXaHnSj-vyOtJkf_ivl5IwzuqI22SDbYZUdoRp9B8Xdx6GQ6Ta3lX5iQdFHfg';
const pushOk = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
function b64ToU8(b){ const p='='.repeat((4-b.length%4)%4), r=(b+p).replace(/-/g,'+').replace(/_/g,'/'), raw=atob(r); return Uint8Array.from([...raw].map(c=>c.charCodeAt(0))); }
async function registrarPush(pedir){
  if(!pushOk() || !S.user) return;
  try{
    const reg = await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    if(Notification.permission==='default' && pedir) await Notification.requestPermission();
    if(Notification.permission!=='granted') return;
    let sub = await reg.pushManager.getSubscription();
    if(!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64ToU8(VAPID_PUBLIC)});
    const j = sub.toJSON();
    await sb.from('push_subscriptions').upsert({endpoint:j.endpoint, user_id:S.user.id, p256dh:j.keys.p256dh, auth:j.keys.auth});
    S.pushAtivo = true; render();
  }catch(e){ console.warn('push', e); }
}
function bannerPush(){
  if(!pushOk() || S.pushAtivo || Notification.permission==='granted' || Notification.permission==='denied') return '';
  return '<div class="aviso" style="display:flex;gap:10px;align-items:center;justify-content:space-between"><span>🔔 Ative os lembretes das refeições</span><button class="btn manga" style="padding:8px 14px" data-act="ativar-push">Ativar</button></div>';
}
// o iPhone só aceita pedir permissão depois de um toque: o primeiro toque no app já abre o pedido
document.addEventListener('click', () => { if(S.user && pushOk() && Notification.permission==='default' && !S.pediu){ S.pediu=true; registrarPush(true); } }, {capture:true});
if(pushOk()) navigator.serviceWorker.register('sw.js').catch(()=>{});

init();
</script>
